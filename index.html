<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biashara Connect Kenya</title>

<style>
:root{
--green:#123b35;
--gold:#edc66b;
--bg:#f5f7f3;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:var(--bg);
}

header{
background:var(--green);
color:white;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

button{
border:none;
padding:10px 15px;
border-radius:6px;
cursor:pointer;
}

.primary{
background:var(--green);
color:white;
}

.gold{
background:var(--gold);
}

.container{
width:90%;
max-width:1100px;
margin:auto;
padding:20px;
}

.hero{
padding:60px 20px;
text-align:center;
background:linear-gradient(135deg,#123b35,#236b58);
color:white;
}

.hero h1{
font-size:48px;
margin-bottom:15px;
}

.hero p{
max-width:700px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:15px;
margin-top:20px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 5px rgba(0,0,0,.1);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
border-radius:8px;
}

.hidden{
display:none;
}

.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.5);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
padding:20px;
border-radius:10px;
width:95%;
max-width:500px;
}

input,
textarea,
select{
width:100%;
padding:10px;
margin:8px 0;
border:1px solid #ccc;
border-radius:6px;
}

.sidebar{
width:220px;
}

.dashboard{
display:flex;
gap:20px;
margin-top:20px;
}

.side-btn{
display:block;
width:100%;
margin-bottom:8px;
background:#eee;
}

.content{
flex:1;
}

.product-row{
padding:10px;
border-bottom:1px solid #ddd;
display:flex;
justify-content:space-between;
}
</style>
</head>

<body>

<header>
<h2>🇰🇪 Biashara Connect Kenya</h2>

<div id="guestButtons">
<button onclick="showLogin()">Login</button>
<button class="gold" onclick="showRegister()">Sell With Us</button>
</div>

<div id="userButtons" class="hidden">
<span id="userLabel"></span>
<button onclick="logout()">Logout</button>
</div>
</header>

<!-- HOME -->

<div id="homePage">

<section class="hero">
<h1>Discover. Connect. Grow.</h1>

<p>
Browse products and services from trusted Kenyan businesses.
</p>

<br>

<button class="gold" onclick="showRegister()">
Register Business
</button>
</section>

<div class="container">

<h2>Marketplace</h2>

<input
id="search"
placeholder="Search products..."
oninput="renderMarketplace()">

<div class="grid" id="marketGrid"></div>

</div>

</div>

<!-- DASHBOARD -->

<div
id="dashboardPage"
class="hidden container">

<div class="dashboard">

<div class="sidebar">

<button
class="side-btn"
onclick="showSection('profile')">
Business Profile
</button>

<button
class="side-btn"
onclick="showSection('products')">
My Products
</button>

</div>

<div class="content">

<div id="profileSection">

<h2>Business Profile</h2>

<input
id="businessName"
placeholder="Business Name">

<input
id="businessPhone"
placeholder="Phone">

<input
id="businessCounty"
placeholder="County">

<textarea
id="businessDescription"
placeholder="Business Description"></textarea>

<input
type="file"
id="profilePhoto">

<button
class="primary"
onclick="saveProfile()">
Save Profile
</button>

</div>

<div
id="productsSection"
class="hidden">

<h2>My Products</h2>

<input
id="prodName"
placeholder="Product Name">

<input
id="prodPrice"
placeholder="Price">

<textarea
id="prodDesc"
placeholder="Description"></textarea>

<button
class="primary"
onclick="addProduct()">
Add Product
</button>

<br><br>

<div id="myProducts"></div>

</div>

</div>

</div>

</div>

<!-- REGISTER -->

<div
class="modal"
id="registerModal">

<div class="modal-content">

<h3>Seller Registration</h3>

<input
id="regName"
placeholder="Full Name">

<input
id="regEmail"
type="email"
placeholder="Email">

<input
id="regPassword"
type="password"
placeholder="Password">

<input
id="regPhone"
placeholder="Phone">

<button
class="primary"
onclick="registerSeller()">
Register
</button>

<br><br>

<button onclick="closeModal('registerModal')">
Close
</button>

</div>

</div>

<!-- LOGIN -->

<div
class="modal"
id="loginModal">

<div class="modal-content">

<h3>Seller Login</h3>

<input
id="loginEmail"
type="email"
placeholder="Email">

<input
id="loginPassword"
type="password"
placeholder="Password">

<button
class="primary"
onclick="loginSeller()">
Login
</button>

<br><br>

<button onclick="closeModal('loginModal')">
Close
</button>

</div>

</div>

<script>

let users =
JSON.parse(localStorage.getItem("bc_users"))
|| [];

let products =
JSON.parse(localStorage.getItem("bc_products"))
|| [];

let currentUser =
JSON.parse(localStorage.getItem("bc_currentUser"));

function saveData(){
localStorage.setItem(
"bc_users",
JSON.stringify(users)
);

localStorage.setItem(
"bc_products",
JSON.stringify(products)
);

localStorage.setItem(
"bc_currentUser",
JSON.stringify(currentUser)
);
}

function showRegister(){
document.getElementById(
"registerModal"
).style.display="flex";
}

function showLogin(){
document.getElementById(
"loginModal"
).style.display="flex";
}

function closeModal(id){
document.getElementById(id)
.style.display="none";
}

function registerSeller(){

let email =
document.getElementById(
"regEmail"
).value.toLowerCase();

if(users.find(
u=>u.email===email
)){
alert("Email already exists");
return;
}

users.push({
id:Date.now(),
name:
document.getElementById(
"regName"
).value,
email:email,
password:
document.getElementById(
"regPassword"
).value,
phone:
document.getElementById(
"regPhone"
).value,
profile:{}
});

saveData();

alert("Registration successful");

closeModal("registerModal");
}

function loginSeller(){

let email =
document.getElementById(
"loginEmail"
).value.toLowerCase();

let password =
document.getElementById(
"loginPassword"
).value;

let found =
users.find(
u =>
u.email===email &&
u.password===password
);

if(!found){
alert("Invalid login");
return;
}

currentUser=found;

saveData();

openDashboard();
}

function openDashboard(){

document.getElementById(
"homePage"
).classList.add("hidden");

document.getElementById(
"dashboardPage"
).classList.remove("hidden");

document.getElementById(
"guestButtons"
).classList.add("hidden");

document.getElementById(
"userButtons"
).classList.remove("hidden");

document.getElementById(
"userLabel"
).innerText =
currentUser.name;

loadMyProducts();
}

function logout(){

currentUser=null;
saveData();

location.reload();
}

function showSection(section){

document.getElementById(
"profileSection"
).classList.add("hidden");

document.getElementById(
"productsSection"
).classList.add("hidden");

if(section==="profile"){
document.getElementById(
"profileSection"
).classList.remove("hidden");
}

if(section==="products"){
document.getElementById(
"productsSection"
).classList.remove("hidden");
}

}

function saveProfile(){

currentUser.profile={
businessName:
businessName.value,
phone:
businessPhone.value,
county:
businessCounty.value,
description:
businessDescription.value
};

users=users.map(
u=>u.id===currentUser.id
? currentUser
: u
);

saveData();

alert("Profile saved");
}

function addProduct(){

products.push({
id:Date.now(),
ownerId:currentUser.id,
owner:currentUser.name,
name:prodName.value,
price:prodPrice.value,
description:prodDesc.value
});

saveData();

loadMyProducts();
renderMarketplace();

prodName.value="";
prodPrice.value="";
prodDesc.value="";
}

function loadMyProducts(){

let mine=
products.filter(
p=>p.ownerId===currentUser.id
);

myProducts.innerHTML="";

mine.forEach(p=>{

myProducts.innerHTML += `
<div class="product-row">
<div>
<b>${p.name}</b><br>
KSh ${p.price}
</div>
<button onclick="removeProduct(${p.id})">
Delete
</button>
</div>
`;

});

}

function removeProduct(id){

products=
products.filter(
p=>p.id!==id
);

saveData();

loadMyProducts();
renderMarketplace();
}

function renderMarketplace(){

let search=
document.getElementById(
"search"
).value.toLowerCase();

marketGrid.innerHTML="";

products
.filter(
p=>p.name
.toLowerCase()
.includes(search)
)
.forEach(p=>{

marketGrid.innerHTML += `
<div class="card">
<img src="https://picsum.photos/400/250?random=${p.id}">
<h3>${p.name}</h3>
<p>KSh ${p.price}</p>
<p>${p.description}</p>
<p><b>${p.owner}</b></p>
</div>
`;

});

}

renderMarketplace();

if(currentUser){
openDashboard();
}

</script>

</body>
</html>
